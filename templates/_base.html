<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#07111f">
<title>{% block title %}SecureAuth{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=hci4">
</head>
<body data-theme="dark">
  <a class="skip-link" href="#mainContent">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"><span></span></div>
  <main class="container auth-shell{% block shellclass %}{% endblock %}">
    <header class="console-header">
      <a class="brand brand-link" href="{{ url_for('dashboard') if session.get('authenticated') else url_for('landing') }}" aria-label="SecureAuth home">
        <div class="logo" aria-hidden="true">
          <img src="{{ url_for('static', filename='img/secureauth-shield.jpg') }}" alt="">
        </div>
        <div class="brand-text">
          <h1>SecureAuth</h1>
          <p class="subtitle">Two-factor authentication</p>
        </div>
      </a>
      <div class="header-actions">
        <button id="accessibilityToggle" class="icon-btn" type="button" title="Accessibility preferences" aria-label="Open accessibility preferences" aria-expanded="false">
          <span class="text-icon" aria-hidden="true">Aa</span>
        </button>
        <button id="themeToggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="accessibilityPanel" class="accessibility-panel" hidden>
      <div class="panel-title-row">
        <div>
          <strong>Accessibility</strong>
          <span>Adjust the interface to your needs.</span>
        </div>
        <button class="panel-close" type="button" data-close-accessibility aria-label="Close accessibility preferences">×</button>
      </div>
      <label class="pref-row"><span><b>Larger text</b><small>Increase interface text size</small></span><input id="prefLargeText" type="checkbox" role="switch"></label>
      <label class="pref-row"><span><b>High contrast</b><small>Strengthen borders and text contrast</small></span><input id="prefHighContrast" type="checkbox" role="switch"></label>
      <label class="pref-row"><span><b>Reduce motion</b><small>Minimize animations and transitions</small></span><input id="prefReduceMotion" type="checkbox" role="switch"></label>
    </div>

    {% if session.get('authenticated') %}
    <nav class="workspace-nav" aria-label="Security workspace">
      <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Overview</span></a>
      <a href="{{ url_for('activity') }}" class="{% if request.endpoint == 'activity' %}active{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.2-6 4.2 12 2.1-6H21"/></svg><span>Activity</span></a>
      <a href="{{ url_for('settings') }}" class="{% if request.endpoint == 'settings' %}active{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.5v-.1A1.7 1.7 0 0 0 8.4 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2v-4h.3A1.7 1.7 0 0 0 4 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06L6.46 3.7l.06.06A1.7 1.7 0 0 0 8.4 4a1.7 1.7 0 0 0 1-.6A1.7 1.7 0 0 0 9.8 2.3V2h4.1v.3A1.7 1.7 0 0 0 15 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 8.4a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.3v4h-.3A1.7 1.7 0 0 0 19.4 15z"/></svg><span>Security</span></a>
      <button type="button" class="nav-help" data-help="SecureAuth uses two independent checks: your password and a rotating authenticator code. The dashboard explains your protection status, recovery options, active session, and recent security events."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.8 1.8c-1 .7-1.6 1.1-1.6 2.3"/><path d="M12 17h.01"/></svg><span>Help</span></button>
    </nav>
    {% endif %}

    <div class="auth-body" id="mainContent">
      {% block content %}{% endblock %}
    </div>
  </main>

  <div id="helpModal" class="help-modal" hidden role="dialog" aria-modal="true" aria-labelledby="helpModalTitle">
    <div class="help-dialog">
      <div class="help-dialog-head">
        <h2 id="helpModalTitle">Quick help</h2>
        <button type="button" id="helpModalClose" class="panel-close" aria-label="Close help">×</button>
      </div>
      <p id="helpModalText"></p>
      <button type="button" class="btn-secondary" id="helpModalDone">Got it</button>
    </div>
  </div>

  <div id="toast" class="ui-toast" role="status" aria-live="polite" hidden></div>

  <script src="{{ url_for('static', filename='js/auth.js') }}?v=hci4"></script>
  <script src="{{ url_for('static', filename='js/motion.js') }}?v=hci4"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
